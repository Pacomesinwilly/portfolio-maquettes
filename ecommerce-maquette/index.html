<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquette — Boutique</title>
    <style>
        body { margin: 0; font-family: Arial; background: #fafafa; }

        header {
            background: #222;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 28px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            border-radius: 5px;
        }

        .btn {
            padding: 10px 20px;
            background: #ff9800;
            color: white;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>Boutique Exemple</header>

<section class="products">
    <div class="product">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Produit 1</h3>
        <p>19,99 €</p>
        <a class="btn">Ajouter au panier</a>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Produit 2</h3>
        <p>24,99 €</p>
        <a class="btn">Ajouter au panier</a>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Produit 3</h3>
        <p>29,99 €</p>
        <a class="btn">Ajouter au panier</a>
    </div>
</section>

<footer>
    © 2025 - Maquette boutique par Pacôme Sinwilly
</footer>

</body>
</html>
